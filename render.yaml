services:
  - type: web
    name: aivoicelivekitdemo
    env: python
    plan: starter
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python -c "from msgraph import GraphServiceClient; from azure.identity import ClientSecretCredential; print('✅ Microsoft Graph SDK installation verified')"
      python -c "import aiohttp, openai; print('✅ WhatsApp dependencies verified')"
    startCommand: python webhook_receiver.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PIP_NO_CACHE_DIR
        value: 1
      - key: WHATSAPP_BOT_ENABLED
        value: true
      - key: CHATWOOT_BOT_WEBHOOK_TOKEN
        value: secure-whatsapp-token-production-2025